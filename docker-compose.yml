services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: sungrip_db
    environment:
      POSTGRES_DB: ${DB_NAME:-sungrip_db}
      POSTGRES_USER: ${DB_USER:-sungrip_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sungrip_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache and Celery Broker
  redis:
    image: redis:7-alpine
    container_name: sungrip_redis
    command: >
      sh -c "redis-server /usr/local/etc/redis/redis.conf --requirepass $${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Backend API
  backend:
    build: ./backend
    container_name: sungrip_backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn sungrip_backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - --log-level info"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sungrip_backend.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: ./backend
    container_name: sungrip_celery_worker
    command: celery -A sungrip_backend worker --loglevel=info --pool=gevent --concurrency=20
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sungrip_backend.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build: ./backend
    container_name: sungrip_celery_beat
    command: celery -A sungrip_backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sungrip_backend.settings
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  # React Frontend (Production)
  frontend:
    build: ./frontend
    container_name: sungrip_frontend
    volumes:
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx_proxy
    container_name: sungrip_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/srv/www/static:ro
      - media_volume:/srv/www/media:ro
      - letsencrypt_certs:/etc/letsencrypt:ro
      - ./nginx_proxy/ssl_custom:/etc/nginx/ssl_custom:ro
      - letsencrypt_webroot:/var/www/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Certbot for SSL Certificate Management
  certbot:
    image: certbot/certbot:latest
    container_name: sungrip_certbot
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_webroot:/var/www/letsencrypt
      - ./certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro
    entrypoint: /bin/sh /usr/local/bin/certbot-renew.sh
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  letsencrypt_certs:
  letsencrypt_webroot:

networks:
  default:
    name: sungrip_network
    driver: bridge
