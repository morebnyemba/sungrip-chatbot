upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:80;
}

# -------------------------------------------------------
# HTTP -> HTTPS redirect for both domains
# -------------------------------------------------------
server {
    listen 80;
    server_name zimgrow.shop api.zimgrow.shop;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------
# Frontend: zimgrow.shop (HTTPS)
# -------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name zimgrow.shop;
    client_max_body_size 100M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zimgrow.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimgrow.shop/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# -------------------------------------------------------
# Backend API: api.zimgrow.shop (HTTPS)
# -------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.zimgrow.shop;
    client_max_body_size 100M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.zimgrow.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zimgrow.shop/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WhatsApp Webhook
    location /webhook/ {
        proxy_pass http://backend_api/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static files
    location /static/ {
        alias /srv/www/static/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Media files
    location /media/ {
        alias /srv/www/media/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
