upstream backend_api {
    server backend:8000;
}

upstream frontend_app {
    server frontend:80;
}

# -------------------------------------------------------
# HTTP -> HTTPS redirect for both domains
# -------------------------------------------------------
server {
    listen 80;
    server_name zimgrow.shop api.zimgrow.shop;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------
# Frontend: zimgrow.shop (HTTPS)
# -------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name zimgrow.shop;
    client_max_body_size 100M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zimgrow.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimgrow.shop/privkey.pem;

    # Recommended SSL settings
    include /etc/nginx/ssl_custom/options-ssl-nginx.conf;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# -------------------------------------------------------
# Backend API: api.zimgrow.shop (HTTPS)
# -------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.zimgrow.shop;
    client_max_body_size 100M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.zimgrow.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zimgrow.shop/privkey.pem;

    # Recommended SSL settings
    include /etc/nginx/ssl_custom/options-ssl-nginx.conf;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API
    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django Admin
    location /admin/ {
        proxy_pass http://backend_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WhatsApp Webhook
    location /webhook/ {
        proxy_pass http://backend_api/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebSocket connections
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location /static/ {
        alias /srv/www/static/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Media files
    location /media/ {
        alias /srv/www/media/;
        expires 7d;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
