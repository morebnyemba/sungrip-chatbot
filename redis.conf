# Redis Security Configuration
# Password authentication is set via command-line argument in docker-compose.yml

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""

# Bind to all interfaces (Docker containers connect over internal network)
bind 0.0.0.0 ::0

# Enable protected mode
protected-mode yes

# Maximum memory policy
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence configuration
save 900 1
save 300 10
save 60 10000

# Append only file (AOF) for better persistence
appendonly yes
appendfsync everysec
